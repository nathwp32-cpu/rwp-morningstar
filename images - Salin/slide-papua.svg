<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Analisis West Papua dengan Kacamata Ilmiah">
  <title>Analisis West Papua dengan Kacamata Ilmiah</title>
  <desc>Pegunungan Papua dengan bendera Bintang Kejora dan palu arit di langit senja</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.5" stop-color="#3a0d0a"/>
      <stop offset="1" stop-color="#8e2a1e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d48a"/>
      <stop offset="1" stop-color="#e8b64c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.7">
    <circle cx="120" cy="80" r="2"/><circle cx="300" cy="50" r="2"/><circle cx="500" cy="90" r="2"/>
    <circle cx="700" cy="60" r="2"/><circle cx="900" cy="100" r="2"/><circle cx="1050" cy="70" r="2"/>
    <circle cx="200" cy="150" r="1.5"/><circle cx="820" cy="140" r="1.5"/><circle cx="980" cy="160" r="1.5"/>
  </g>
  <!-- mountains -->
  <g fill="#0b0b0d">
    <polygon points="0,420 180,180 360,420"/>
    <polygon points="240,420 480,120 720,420"/>
    <polygon points="600,420 820,200 1040,420"/>
    <polygon points="900,420 1100,240 1200,340 1200,420"/>
  </g>
  <g fill="#141418">
    <polygon points="0,420 180,180 360,420" transform="translate(0,40)"/>
    <polygon points="240,420 480,120 720,420" transform="translate(0,50)"/>
    <polygon points="600,420 820,200 1040,420" transform="translate(0,45)"/>
  </g>
  <!-- Morning Star flag on peak -->
  <g transform="translate(480,120)">
    <rect x="0" y="0" width="120" height="70" rx="3" fill="#c0392b"/>
    <polygon points="60,-30 70,-8 94,-8 74,6 82,30 60,16 38,30 46,6 26,-8 50,-8" fill="#fff"/>
  </g>
  <!-- hammer & sickle small -->
  <g transform="translate(900,200)" fill="#e8b64c">
    <path d="M-16,-10 L-16,10 L-12,10 L-12,-2 L-2,-2 L-2,10 L2,10 L2,-2 L-16,-2 Z"/>
    <circle cx="0" cy="-16" r="9" fill="none" stroke="#e8b64c" stroke-width="4"/>
  </g>
  <rect x="0" y="470" width="1200" height="30" fill="url(#gold)"/>
</svg>