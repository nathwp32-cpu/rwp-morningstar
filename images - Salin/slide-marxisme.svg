<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Marxisme Ilmiah untuk West Papua">
  <title>Marxisme Ilmiah untuk West Papua</title>
  <desc>Bendera merah dengan palu arit dan Bintang Kejora di atas latar hitam pekat dengan aksen emas</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.55" stop-color="#2a0d0a"/>
      <stop offset="1" stop-color="#5c1710"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#c0392b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c0392b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d48a"/>
      <stop offset="1" stop-color="#e8b64c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#glow)"/>
  <g stroke="#e8b64c" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
  </g>
  <g transform="translate(300,60)">
    <rect x="0" y="0" width="600" height="380" rx="8" fill="#c0392b"/>
    <rect x="0" y="0" width="600" height="380" rx="8" fill="url(#glow)" opacity="0.4"/>
    <g transform="translate(300,190)" fill="#f5d48a">
      <path d="M-70,-40 L-70,40 L-52,40 L-52,-8 L-6,-8 L-6,40 L12,40 L12,-8 L-70,-8 Z"/>
      <circle cx="0" cy="-60" r="34" fill="none" stroke="#f5d48a" stroke-width="12"/>
    </g>
    <g transform="translate(300,150)">
      <polygon points="0,-46 12,-14 46,-14 18,6 28,40 0,20 -28,40 -18,6 -46,-14 -12,-14" fill="#fff"/>
    </g>
  </g>
  <rect x="0" y="470" width="1200" height="30" fill="url(#gold)"/>
</svg>