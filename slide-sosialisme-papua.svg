<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Sosialisme Papua dan Perjuangan Rakyat">
  <title>Sosialisme Papua dan Perjuangan Rakyat</title>
  <desc>Kepalan tangan terangkat dengan pita Bintang Kejora dan palu arit, simbol perjuangan rakyat Papua</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.6" stop-color="#2a0d0a"/>
      <stop offset="1" stop-color="#5c1710"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#c0392b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c0392b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d48a"/>
      <stop offset="1" stop-color="#e8b64c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#glow)"/>
  <!-- raised fist -->
  <g transform="translate(600,250)">
    <path d="M-70,120 C-80,60 -60,20 -30,10 L-30,-40 C-30,-60 -20,-70 -10,-70 C0,-70 10,-60 10,-40 L10,10 C40,20 60,60 50,120 Z" fill="#e8b64c"/>
    <path d="M-30,-40 L-30,-70 C-30,-90 -20,-100 -10,-100 C0,-100 10,-90 10,-70 L10,-40 Z" fill="#f5d48a"/>
    <path d="M-30,-70 L-30,-95 C-30,-110 -22,-118 -12,-118 C-2,-118 6,-110 6,-95 L6,-70 Z" fill="#e8b64c"/>
    <path d="M-12,-118 L-12,-140 C-12,-150 -6,-155 0,-155 C6,-155 12,-150 12,-140 L12,-118 Z" fill="#f5d48a"/>
    <path d="M-70,120 L-70,60 C-70,20 -50,0 -30,-10 L-30,10 C-50,20 -60,40 -60,60 Z" fill="#c0392b"/>
    <path d="M10,120 L10,60 C10,20 -10,0 -30,-10 L-30,10 C-10,20 0,40 0,60 Z" fill="#c0392b"/>
  </g>
  <!-- ribbon -->
  <g transform="translate(600,120)">
    <path d="M-160,0 C-80,-30 80,-30 160,0 L150,20 C80,-10 -80,-10 -150,20 Z" fill="#c0392b"/>
    <polygon points="0,-18 8,-4 24,-4 12,6 16,22 0,12 -16,22 -12,6 -24,-4 -8,-4" fill="#fff"/>
  </g>
  <rect x="0" y="470" width="1200" height="30" fill="url(#gold)"/>
</svg>